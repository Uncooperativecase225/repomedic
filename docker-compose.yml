services:
  mysql:
    image: mysql:8.4
    container_name: repomedic-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: repomedic
      MYSQL_USER: repomedic
      MYSQL_PASSWORD: ${DB_PASSWORD:-repomedic_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - repomedic_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_me_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  repomedic_mysql_data:
